name: deploy

# Entrega contínua:
#   push em staging    -> homologação (automático)
#   push em production -> produção (aprovação manual no GitHub Environment "production")
# Autenticação na AWS por OIDC, sem chaves de longa duração.
on:
  push:
    branches: [staging, production]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'homolog' }}
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build and push images (tag = SHA do commit)
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker build --target runtime -t "$REPO:$IMAGE_TAG" .
          docker build --target build -t "$REPO:$IMAGE_TAG-migrate" .
          docker push "$REPO:$IMAGE_TAG"
          docker push "$REPO:$IMAGE_TAG-migrate"
          echo "IMAGE=$REPO:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=$REPO:$IMAGE_TAG-migrate" >> "$GITHUB_ENV"

      # Gera uma nova revisão da task definition trocando só a imagem.
      - name: register task definitions
        run: |
          register() {
            aws ecs describe-task-definition --task-definition "$1" --query taskDefinition \
              | jq --arg img "$2" '.containerDefinitions[0].image = $img
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                        .compatibilities, .registeredAt, .registeredBy)' > td.json
            aws ecs register-task-definition --cli-input-json file://td.json \
              --query taskDefinition.taskDefinitionArn --output text
          }
          echo "MIGRATE_TD=$(register "${{ vars.ECS_CLUSTER }}-migrate" "$MIGRATE_IMAGE")" >> "$GITHUB_ENV"
          echo "BACKEND_TD=$(register "${{ vars.ECS_CLUSTER }}-backend" "$IMAGE")" >> "$GITHUB_ENV"

      # Migrações como tarefa avulsa, antes de atualizar o serviço.
      - name: run database migrations
        run: |
          TASK=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "$MIGRATE_TD" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.APP_SUBNETS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "migration task: $TASK"
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "exit code: $CODE"
          test "$CODE" = "0"

      # Circuit breaker no serviço reverte sozinho se as novas tasks não ficarem saudáveis.
      - name: deploy backend service
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service backend \
            --task-definition "$BACKEND_TD" --query service.serviceName --output text
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services backend
